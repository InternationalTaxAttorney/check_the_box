[project]
name = "check-the-box"
version = "1.0.1"
description = "Randomly generated practice problems on the U.S. check-the-box entity classification rules, served as a Flask Blueprint"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Andrew Mitchel" }]
requires-python = ">=3.13"
dependencies = [
    "flask>=3.0",
]

[project.urls]
Homepage = "https://www.andrewmitchel.com/resources/check_the_box"
Repository = "https://github.com/InternationalTaxAttorney/check_the_box"

[project.scripts]
check-the-box = "check_the_box.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 150

[tool.ruff.format]
quote-style = "single"
